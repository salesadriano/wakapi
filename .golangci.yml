version: "2"

run:
  timeout: 5m

linters:
  # Conservative starting set: the golangci-lint v2 "standard" group
  # (errcheck, govet, ineffassign, staticcheck, unused). The team can
  # tighten this over time without breaking CI on the first run.
  default: standard
  exclusions:
    generated: lax
    # Hand-maintained mocks and the scripts helpers are intentionally noisy.
    paths:
      - mocks
      - scripts

issues:
  # Incremental adoption on a legacy codebase: only gate issues introduced since
  # the merge-base with master. The pre-existing backlog (~121+ findings, capped
  # at 50/linter in reports) is grandfathered and can be burned down in dedicated,
  # compiler-validated PRs. Requires fetch-depth: 0 on the lint job checkout.
  new-from-merge-base: origin/master
