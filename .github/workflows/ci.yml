name: ci
on:
  push:
  pull_request:

jobs:
  lint:
    name: 'Lint & vet'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v5

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: ^1.26
      id: go

    - name: go vet
      run: go vet `go list ./... | grep -v 'github.com/muety/wakapi/scripts'`

    # Report-only for now: golangci-lint surfaces pre-existing findings in the
    # legacy codebase. Keep it non-blocking until those are cleaned up, then drop
    # continue-on-error to make it a hard gate. `go vet` above stays blocking.
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      continue-on-error: true
      with:
        version: latest

  test:
    name: 'Unit- & API tests'
    # because of https://github.com/usebruno/bruno/issues/5003, we currently need Node.js v20, so pinning runner image at ubuntu 24.04 for now
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v5

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: ^1.26
      id: go

    - name: Get dependencies
      run: go get

    - name: Unit Tests
      run: CGO_ENABLED=0 go test `go list ./... | grep -v 'github.com/muety/wakapi/scripts'` -run ./...  # skip scripts package, because not actually a package

    - name: API Tests
      # bruno pinned to version 2.15.0 because of https://github.com/usebruno/bruno/issues/6837
      run: |
        npm install -g @usebruno/cli@2.15.0
        ./testing/run_api_tests.sh

    - name: Mail Tests
      run: ./testing/run_mail_tests.sh

  coverage:
    name: 'Coverage ratchet'
    # Only enforce on PRs, where we can compare against the base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: ^1.26
      id: go

    - name: Measure & enforce coverage (base vs head)
      run: |
        set -e
        measure() {
          local pkgs
          pkgs=$(go list ./... | grep -v 'github.com/muety/wakapi/scripts')
          CGO_ENABLED=0 go test -coverprofile="$1" $pkgs >/dev/null 2>&1 || true
          go tool cover -func="$1" 2>/dev/null | awk '/^total:/ {gsub("%","",$3); print $3+0}' || echo 0
        }
        git checkout --quiet ${{ github.event.pull_request.base.sha }}
        BASE=$(measure base.out); BASE=${BASE:-0}
        git checkout --quiet ${{ github.sha }}
        HEAD=$(measure head.out); HEAD=${HEAD:-0}
        echo "Base coverage: ${BASE}%  |  Head coverage: ${HEAD}%"
        awk -v b="$BASE" -v h="$HEAD" 'BEGIN {
          if (h + 0.01 < b) { printf "FAIL: coverage decreased from %.2f%% to %.2f%%\n", b, h; exit 1 }
          printf "OK: coverage %.2f%% -> %.2f%%\n", b, h
        }'

  migration:
    name: Migration tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql, mariadb]

    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v5

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version: ^1.26
      id: go

    - run: npm install -g @usebruno/cli@2.15.0

    - run: ./testing/run_api_tests.sh ${{ matrix.db }} --migration
