# Wakapi — Docker Swarm stack for Portainer (Docker Secrets variant)
#
# Same as stack.yml, but the sensitive values (DB password and password salt) are
# read from Docker Swarm secrets via Wakapi's "*_FILE" convention instead of plain
# environment variables. Create the secrets BEFORE deploying:
#
#   printf '%s' 'a-strong-db-password'   | docker secret create wakapi_db_password -
#   printf '%s' 'a-long-random-salt'     | docker secret create wakapi_password_salt -
#
# Then deploy this file in Portainer (the secrets are referenced as "external").
# All non-secret settings still come from environment variables — see
# .env.portainer.example and docs/deploy/portainer-swarm.md.

version: "3.8"

services:
  wakapi:
    image: ${WAKAPI_IMAGE_REPO:-ghcr.io/salesadriano/wakapi}:${WAKAPI_IMAGE_TAG:-latest}
    init: true
    stop_grace_period: 30s
    ports:
      - target: 3000
        published: ${WAKAPI_PUBLISHED_PORT:-3000}
        protocol: tcp
        mode: ingress
    environment:
      # --- database ---
      WAKAPI_DB_TYPE: postgres
      WAKAPI_DB_HOST: db
      WAKAPI_DB_PORT: "5432"
      WAKAPI_DB_NAME: ${WAKAPI_DB_NAME:-wakapi}
      WAKAPI_DB_USER: ${WAKAPI_DB_USER:-wakapi}
      WAKAPI_DB_PASSWORD_FILE: /run/secrets/wakapi_db_password
      # --- security ---
      WAKAPI_PASSWORD_SALT_FILE: /run/secrets/wakapi_password_salt
      WAKAPI_SESSION_KEY: ${WAKAPI_SESSION_KEY:-}
      WAKAPI_INSECURE_COOKIES: ${WAKAPI_INSECURE_COOKIES:-true}
      WAKAPI_ENABLE_PROXY: ${WAKAPI_ENABLE_PROXY:-true}
      # --- app ---
      WAKAPI_PUBLIC_URL: ${WAKAPI_PUBLIC_URL:-http://localhost:3000}
      WAKAPI_BASE_PATH: ${WAKAPI_BASE_PATH:-/}
      WAKAPI_ALLOW_SIGNUP: ${WAKAPI_ALLOW_SIGNUP:-true}
      WAKAPI_LEADERBOARD_ENABLED: ${WAKAPI_LEADERBOARD_ENABLED:-true}
      # --- mail (optional) ---
      WAKAPI_MAIL_ENABLED: ${WAKAPI_MAIL_ENABLED:-false}
      WAKAPI_MAIL_SENDER: ${WAKAPI_MAIL_SENDER:-}
      WAKAPI_MAIL_SMTP_HOST: ${WAKAPI_MAIL_SMTP_HOST:-}
      WAKAPI_MAIL_SMTP_PORT: ${WAKAPI_MAIL_SMTP_PORT:-}
      WAKAPI_MAIL_SMTP_USER: ${WAKAPI_MAIL_SMTP_USER:-}
      WAKAPI_MAIL_SMTP_PASS: ${WAKAPI_MAIL_SMTP_PASS:-}
      WAKAPI_MAIL_SMTP_TLS: ${WAKAPI_MAIL_SMTP_TLS:-false}
    secrets:
      - wakapi_db_password
      - wakapi_password_salt
    volumes:
      - wakapi-data:/data
    networks:
      - wakapi
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  db:
    image: postgres:17-alpine
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${WAKAPI_DB_NAME:-wakapi}
      POSTGRES_USER: ${WAKAPI_DB_USER:-wakapi}
      POSTGRES_PASSWORD_FILE: /run/secrets/wakapi_db_password
    secrets:
      - wakapi_db_password
    volumes:
      - wakapi-db-data:/var/lib/postgresql/data
    networks:
      - wakapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s

volumes:
  wakapi-data: {}
  wakapi-db-data: {}

networks:
  wakapi:
    driver: overlay
    attachable: true

secrets:
  wakapi_db_password:
    external: true
  wakapi_password_salt:
    external: true
